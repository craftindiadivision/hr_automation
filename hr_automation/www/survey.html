<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Survey</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
		.notice { padding: 16px; background: #f5f5f5; border-radius: 6px; }
		.intro { color: #555; margin-bottom: 24px; white-space: pre-wrap; }
		.anon-badge { display: inline-block; font-size: 12px; color: #2e7d32; background: #eaf4ea;
			padding: 4px 10px; border-radius: 12px; margin-bottom: 16px; }
		fieldset { border: none; border-top: 1px solid #eee; padding: 16px 0; margin: 0 0 8px; }
		legend { font-weight: 600; padding: 0; margin-bottom: 10px; width: 100%; }
		.required { color: #c62828; }
		label.option { display: block; font-weight: 400; font-size: 14px; margin: 6px 0; cursor: pointer; }
		input[type="text"], input[type="password"], textarea, select {
			width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px; margin-top: 6px;
		}
		textarea { resize: vertical; }
		button { margin-top: 16px; padding: 10px 24px; background: #2e7d32; color: #fff;
			border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
		#status { margin-top: 16px; color: #c62828; }
	</style>
	<script>window.frappe = window.frappe || {};</script>
	<!-- csrf_token -->
</head>
<body>

<div id="app"><p class="notice">Loading survey...</p></div>

<script>
(function () {
	var token = {{ (token or "") | tojson }};
	var app = document.getElementById("app");

	if (!token) {
		app.innerHTML = '<p class="notice">This link is missing its access token. Please use the link from your invite email.</p>';
		return;
	}

	function extractMessage(data) {
		try {
			if (data._server_messages) {
				var messages = JSON.parse(data._server_messages);
				return JSON.parse(messages[0]).message;
			}
		} catch (e) { /* fall through */ }
		return null;
	}

	function call(method, args) {
		var headers = { "Content-Type": "application/json" };
		if (window.frappe && frappe.csrf_token && frappe.csrf_token !== "None") {
			headers["X-Frappe-CSRF-Token"] = frappe.csrf_token;
		}
		return fetch("/api/method/" + method, {
			method: "POST",
			headers: headers,
			body: JSON.stringify(args),
		}).then(function (r) {
			return r.json().then(function (data) {
				if (!r.ok) throw new Error(extractMessage(data) || "Request failed");
				return data.message;
			});
		});
	}

	function loadSurvey() {
		call("hr_automation.api.employee_survey.get_survey", { token: token })
			.then(function (data) {
				if (data.already_submitted) {
					app.innerHTML = '<p class="notice">A response has already been submitted using this link. Thank you!</p>';
				} else {
					renderSurvey(data);
				}
			})
			.catch(function (e) {
				app.innerHTML = '<p class="notice">' + (e.message || "This survey is not available.") + "</p>";
			});
	}

	function optionList(optionsText) {
		return (optionsText || "").split("\n").map(function (o) { return o.trim(); }).filter(Boolean);
	}

	function renderQuestion(q) {
		var reqd = q.is_mandatory ? ' <span class="required">*</span>' : "";
		var html = '<fieldset><legend>' + escapeHtml(q.question) + reqd + '</legend>';

		if (q.question_type === "Short Answer") {
			html += '<input type="text" data-q="' + q.name + '">';
		} else if (q.question_type === "Long Answer") {
			html += '<textarea rows="3" data-q="' + q.name + '"></textarea>';
		} else if (q.question_type === "Yes/No") {
			["Yes", "No"].forEach(function (opt) {
				html += '<label class="option"><input type="radio" name="q-' + q.name + '" value="' + opt + '"> ' + opt + '</label>';
			});
		} else if (q.question_type === "Rating (1-5)") {
			for (var i = 1; i <= 5; i++) {
				html += '<label class="option" style="display:inline-block;margin-right:14px;">' +
					'<input type="radio" name="q-' + q.name + '" value="' + i + '"> ' + i + '</label>';
			}
		} else if (q.question_type === "Single Choice") {
			optionList(q.options).forEach(function (opt) {
				html += '<label class="option"><input type="radio" name="q-' + q.name + '" value="' + escapeHtml(opt) + '"> ' + escapeHtml(opt) + '</label>';
			});
		} else if (q.question_type === "Multiple Choice") {
			optionList(q.options).forEach(function (opt) {
				html += '<label class="option"><input type="checkbox" data-q="' + q.name + '" value="' + escapeHtml(opt) + '"> ' + escapeHtml(opt) + '</label>';
			});
		}

		html += "</fieldset>";
		return html;
	}

	function escapeHtml(s) {
		var div = document.createElement("div");
		div.innerText = s;
		return div.innerHTML;
	}

	function collectAnswer(q) {
		if (q.question_type === "Short Answer" || q.question_type === "Long Answer") {
			var el = document.querySelector('[data-q="' + q.name + '"]');
			return el ? el.value.trim() : "";
		}
		if (q.question_type === "Multiple Choice") {
			var boxes = document.querySelectorAll('input[data-q="' + q.name + '"]:checked');
			return Array.prototype.map.call(boxes, function (b) { return b.value; });
		}
		var checked = document.querySelector('input[name="q-' + q.name + '"]:checked');
		return checked ? checked.value : "";
	}

	function renderSurvey(data) {
		var html = '<span class="anon-badge">This survey is completely anonymous</span>';
		html += "<h3>" + escapeHtml(data.title) + "</h3>";
		if (data.introduction) {
			html += '<p class="intro">' + escapeHtml(data.introduction) + "</p>";
		}
		html += '<form id="survey-form">';
		data.questions.forEach(function (q) {
			html += renderQuestion(q);
		});
		html += '<button type="submit">Submit</button></form><p id="status"></p>';
		app.innerHTML = html;

		document.getElementById("survey-form").addEventListener("submit", function (e) {
			e.preventDefault();
			var statusEl = document.getElementById("status");

			var missing = null;
			var answers = data.questions.map(function (q) {
				var answer = collectAnswer(q);
				if (q.is_mandatory && (!answer || answer.length === 0)) {
					missing = q.question;
				}
				return { question: q.name, answer: answer };
			});

			if (missing) {
				statusEl.innerText = "Please answer: " + missing;
				return;
			}

			statusEl.style.color = "#555";
			statusEl.innerText = "Submitting...";

			call("hr_automation.api.employee_survey.submit_response", {
				token: token,
				answers: JSON.stringify(answers),
			})
				.then(function () {
					app.innerHTML = '<p class="notice">Thank you! Your response has been recorded anonymously.</p>';
				})
				.catch(function (e) {
					statusEl.style.color = "#c62828";
					statusEl.innerText = e.message || "Submission failed. Please try again.";
				});
		});
	}

	loadSurvey();
})();
</script>
</body>
</html>
